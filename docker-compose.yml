services:
  decision-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocare
      POSTGRES_USER: vocare
      POSTGRES_PASSWORD: vocare_local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocare -d vocare"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - vocare_postgres:/var/lib/postgresql/data

volumes:
  vocare_postgres:
